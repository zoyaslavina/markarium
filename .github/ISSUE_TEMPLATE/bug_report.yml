name: Bug report
description: Report a reproducible problem in the standalone HTML edition
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve MD Reader. For security vulnerabilities, use the private reporting link described in SECURITY.md instead of this form.
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Safari
        - Firefox
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MD Reader version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Remove private document content and provide the smallest safe sample possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: checkboxes
    id: accessibility
    attributes:
      label: Accessibility impact
      options:
        - label: This affects keyboard, screen-reader, zoom, contrast or reduced-motion use.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed confidential document text, annotation content and file paths from this report.
          required: true
